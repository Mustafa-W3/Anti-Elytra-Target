# ══════════════════════════════════════════════════════════════════════════════
# GUI — Verdächtigen-Rangliste  (/aet suspect)
#
# Unterstützt alle drei Farbformate (MiniMessage, Hex, Legacy-&-Codes).
# Platzhalter stehen in den Kommentaren über jedem Schlüssel.
# ══════════════════════════════════════════════════════════════════════════════
gui:
  suspect:

    # Inventartitel oben im GUI-Fenster.
    title: '<yellow>Hauptverdächtige'

    # Anzahl der Inventarslots (muss ein Vielfaches von 9 sein, max. 54).
    size: 54

    # ── Spielerkopf-Item ──────────────────────────────────────────────────────
    # Anzeigename jedes Spielerkopfs. Platzhalter: {player}
    head_name: '<gold>{player}'

    # Lore beim Darüberfahren. Platzhalter: {total} {window} {stage}
    lore_total:   '<gray>Gesamtverstöße: <red>{total}'
    lore_window:  '<gray>Fensterverstöße: <yellow>{window}'
    lore_status:  '<gray>Status: {stage}'
    lore_click:   '<dark_gray>Für Detailprofil klicken'

    # ── Statusbezeichnungen ───────────────────────────────────────────────────
    # Wird oben in lore_status als {stage} eingefügt.
    stage_watching:  '<aqua>👁 BEOBACHTET'
    stage_testing:   '<yellow>⚠ WIRD GEPRÜFT'
    stage_blocking:  '<red>⛔ BLOCKIERUNG AKTIV'

    # ── Profil-Ausgabe im Chat ────────────────────────────────────────────────
    # Wird im Chat angezeigt, wenn ein Spieler im GUI einen Kopf anklickt.

    # Trennlinie zwischen Abschnitten.
    divider: '<dark_gray>──────────────────────────────────────────────'

    # Kopfzeile. Platzhalter: {player}
    profile_header:  '<gold>  AntiElytraTarget-Profil: <yellow>{player}'

    # UUID-Zeile. Platzhalter: {uuid}
    profile_uuid:    '<gray>  UUID: <white>{uuid}'

    # Zeile für Gesamt-Flags. Platzhalter: {total}
    profile_total:   '<gray>  Gesamtverstöße: <red>{total}'

    # Überschrift der Aufschlüsselung pro Prüfung.
    profile_breakdown_header: '<aqua>  Verstoßübersicht:'

    # Zeile der Aufschlüsselung pro Prüfung. Platzhalter: {check} {count}
    profile_breakdown_line: '<dark_gray>    • <yellow>{check}<gray>: <red>{count}'

    # Überschrift der letzten Einträge (zeigt die letzten 10 Flags).
    profile_recent_header: '<aqua>  Letzte 10 Einträge (neueste zuerst):'

    # Jede Zeile eines letzten Eintrags. Platzhalter: {index} {entry}
    profile_recent_line: '<dark_gray>  [{index}] {entry}'

