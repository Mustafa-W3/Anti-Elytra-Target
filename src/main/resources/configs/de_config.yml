# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  AntiElytraTarget v5.3.1.3 — Konfiguration                          ║
# ║                                                                       ║
# ║  FARBFORMATE (alle drei können in derselben Zeichenkette gemischt werden): ║
# ║    MiniMessage : <red>, <gradient:red:gold>, <bold>, <italic>         ║
# ║  <hover:show_text:'Tooltip'>, <click:run_command:...>                 ║
# ║  Hex-Farben : &#FF5555  oder  <#FF5555>  oder  <color:#FF5555>        ║
# ║  Legacy-Codes: &a, &c, &e, &7, &f, &l, &o …                           ║
# ╚═══════════════════════════════════════════════════════════════════════╝

# ── Allgemein (deutsche Sprachkonfiguration) ──────────────────────────────
general:
  enabled: true
  prefix: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset>"
  # Wenn aktiviert, enthält flags.log erweiterte Laufzeitdetails zu jedem Flag.
  debugmod: true

performance:
  # Wenn die 1-Minuten-TPS unter diesen Wert fällt, pausieren rechenintensive Erkennungs-/Wiederholungsaufgaben automatisch.
  # Auf 0 setzen, um diesen Schutz zu deaktivieren.
  disable_below_tps: 16.0

# ── Erkennung (globaler Schalter) ─────────────────────────────────────────
detection:
  enabled: true
  # Bricht Versuche ab, FIREWORK_ROCKET in die Zweithand zu legen.
  block_offhand_firework: true
  # Verhindert Angriffe auf Spieler, während FIREWORK_ROCKET in der Haupthand gehalten wird.
  block_mainhand_firework_attacks: false

compatibility:
  # Nur aktivieren, wenn Floodgate-/Geyser-Bedrock-Spieler den Server nutzen.
  bedrock_support: false
  # Spielernamen mit diesem Präfix werden als Bedrock behandelt.
  bedrock_name_prefix: "."
  # Synthetische Ping-/Transaktionspakete betreiben Packet-Order-Prüfungen.
  # Sie werden mit niedriger Rate und positiven IDs gesendet, damit Anti-Cheat-Kompatibilität erhalten bleibt.
  synthetic_transactions: true
  synthetic_transaction_interval_ticks: 5

# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  PRÜFUNGEN — Jede Prüfung hat:                                        ║
# ║  enabled     : ein-/ausschalten                                       ║
# ║  decay       : VL-Abbau pro Tick ohne Flag                            ║
# ║  + prüfungsspezifische Schwellenwerte                                 ║
# ╚═══════════════════════════════════════════════════════════════════════╝

checks:
  # ── KAMPF-PRÜFUNGEN ───────────────────────────────────────────────────────
  AngleDeviation:
    enabled: true
    decay: 0.1
    sample_size: 25
    zfactor_vl_limit: 7.0

  AimSnap:
    enabled: true
    decay: 0.15
    spike_vl_limit: 7.0
    randomizer_vl_limit: 2.5

  AttackRate:
    enabled: true
    decay: 0.2
    max_hits_per_second: 12

  TimingConsistency:
    enabled: true
    decay: 0.1
    max_std_dev_ms: 50.0
    sample_size: 6

  ElytraCombatRate:
    enabled: true
    decay: 0.15
    max_rot_per_tick: 40.0
    speed_threshold: 0.5

  # ── ZIEL-PRÜFUNGEN ────────────────────────────────────────────────────────
  SmoothAim:
    enabled: true
    decay: 0.1
    max_std_dev: 1.5
    sample_size: 30

  GCD:
    enabled: true
    decay: 0.05

  LookVectorLock:
    enabled: true
    decay: 0.1
    sample_size: 12
    max_variance: 2.0

  PitchLock:
    enabled: true
    decay: 0.1
    sample_size: 15
    max_variance: 4.0

  RotationConsistency:
    enabled: true
    decay: 0.1
    sample_size: 10
    max_std_dev: 1.0


  AimComplex:
    enabled: true
    decay: 0.05
    entropy_vl_limit: 30
    distinct_vl_limit: 4.0
    randomizer_vl_limit: 2.5

  AimHeuristic:
    enabled: true
    decay: 0.03
    basic_vl_limit: 400
    basic_l2_vl_limit: 400
    pattern_buffer_limit: 2.5
    factor_buffer_limit: 3.0

  # ── ELYTRA-PRÜFUNGEN ──────────────────────────────────────────────────────
  VelocityAlign:
    enabled: true
    decay: 0.1
    match_threshold: 8.0
    consecutive_matches: 12
    max_velocity_magnitude: 1.8

  StrafeSync:
    enabled: false
    decay: 0.05
    max_deviation: 0.15
    sample_size: 20
    approach_rate_skip: 0.3

  AccelerationLock:
    enabled: true
    decay: 0.05
    max_std_dev: 0.02
    sample_size: 30
    max_target_age_ms: 2500

  ElytraPhysics:
    enabled: true
    decay: 0.05

  # ── SONSTIGE PRÜFUNGEN ────────────────────────────────────────────────────
  FireworkPattern:
    enabled: true
    decay: 0.05
    sample_size: 8
    max_interval_std_dev: 100.0

  OffhandFireworkSwitch:
    enabled: true
    decay: 0.1

  # EXPERIMENTELL
  IncapableSwap:
    enabled: true
    decay: 0.08
    max_tick_span: 1
    max_sequence_ms: 175
    evidence_window_ms: 8000
    evidence_threshold: 3.0

  HeadPitchDivergence:
    enabled: true
    decay: 0.1
    min_y_delta_blocks: 2.0
    max_pitch_delta_deg: 1.5

  UseItemRotationMismatch:
    enabled: true
    decay: 0.05
    allow_previous_rotation: true
    require_gliding: true
    require_firework: true
    min_interval_ms: 0

  PacketOrderE:
    enabled: true
    decay: 0.05

  RotationPrediction:
    enabled: true
    decay: 0.1
    min_target_distance: 0.75
    max_target_distance: 10.0
    target_lock_min_center_distance: 0.35
    orbit_max_target_distance: 8.5
    min_previous_error: 18.0
    max_landing_error: 0.20
    max_hit_error: 0.50
    min_geodesic_rotation: 12.0
    max_geodesic_rotation: 160.0
    min_convergence_ratio: 0.985
    max_correction_residual: 0.35
    rapid_hit_min_yaw: 75.0
    min_sample_gap_ms: 25
    max_sample_gap_ms: 100
    max_candidate_age_ms: 125
    rapid_hit_window_ms: 250
    orbit_detection_enabled: true
    validation_samples: 5
    evidence_hit_window: 16
    required_confirmed_candidates: 3
    rapid_hit_required: 3
    evidence_window_ms: 6000
    alert_cooldown_ms: 5000


# ── Strafen ───────────────────────────────────────────────────────────────
penalty:
  test_mode_threshold: 2
  block_mode_threshold: 5
  test_mode_block_ratio: 0.5
  kick_enabled: true
  kick_threshold: 20
  kick_message: '<red>Gekickt: ElytraTarget-Hack erkannt.'
  kick_command_enabled: false
  kick_command: "kick {player} ElytraTarget detected"
  ban_enabled: false
  ban_threshold: 60
  ban_message: '<red>Gebannt: ElytraTarget-Hack verwendet.'
  ban_duration_minutes: 1440
  ban_command_enabled: false
  ban_command: "tempban {player} 1d ElytraTarget detected"

# ── Protokollierung ───────────────────────────────────────────────────────
logging:
  file_logging: true
  log_file_path: "logs/flags.log"
  console_logging: true
  op_alerts_default: true
  log_location: true
  log_victim_info: true
  max_profile_entries: 200

# ── Ausnahmen ─────────────────────────────────────────────────────────────
exemptions:
  max_ping: 100
  exempt_creative: true
  exempt_spectator: true
  bypass_permission: "antielytratarget.bypass"

# ── Wiederholungssystem ───────────────────────────────────────────────────
# Zeichnet Spieleraktionen auf, wenn der Flag-Schwellenwert erreicht wird.
# Wiederholungen können über /aet replay im GUI-Menü angesehen werden.
# Keine externen NPC-Plugins erforderlich — nutzt rohe NMS-Pakete.
replay:
  # Wiederholungssystem ein-/ausschalten. Standard: false.
  enabled: false

  # Die Aufnahme beginnt immer beim zweiten protokollierten Flag; es gibt keinen Voraufnahmepuffer.

  # Dauer jeder Wiederholungsaufnahme in Sekunden.
  duration_seconds: 45

  # Lebende Entitäten um den geflaggten Spieler werden in jedem Wiederholungs-Frame gespeichert.
  entity_radius: 18.0
  max_actors_per_frame: 24
  max_effects_per_frame: 128

  # Kürzlich getroffene Ziele in der Aufnahme behalten, auch wenn sie kurz den Radius verlassen.
  target_keep_seconds: 8

  # Maximale Anzahl von Wiederholungsdateien, die auf der Festplatte behalten werden.
  # Älteste Wiederholungen werden nicht automatisch gelöscht; manuell oder per GUI verwalten.
  max_files: 100
  isolation_radius: 96.0

# ── Benachrichtigungen ────────────────────────────────────────────────────
# Warnmeldung im Chat. Für Details mit der Maus darüberfahren.
# Platzhalter: {player} {check} {flags} {window} {location}
notifications:
  alert_message: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset><yellow>{player} <dark_gray>| <red>{check} <dark_gray>| <gray>{flags}x <dark_gray>| <gray>{location}"

  # Klickaktion für die gesamte Warnzeile.
  # alert_click_action: run_command, suggest_command, open_url, copy_to_clipboard
  # Platzhalter: wie bei alert_message und alert_hover.
  alert_click_enabled: true
  alert_click_action: run_command
  alert_click_command: "/aet tpa {player}"

  # Tooltip, der beim Überfahren der Warnzeile angezeigt wird.
  # Für neue Zeilen \n verwenden. Unterstützt MiniMessage, Hex und Legacy-Farben.
  # Platzhalter: {player} {ping} {gamemode} {world} {x} {y} {z}
  #               {check} {flags} {window} {victim}
  alert_hover: '<gray>Spielername: <white>{player}\n<gray>Ping: <green>{ping}ms\n<gray>Spielmodus: <aqua>{gamemode}\n<gray>Position: <white>{world} <yellow>{x}<gray>, <yellow>{y}<gray>, <yellow>{z}\n<gray>Prüfung: <red>{check}\n<gray>Gesamtverstöße: <red>{flags}\n<gray>Fensterverstöße: <yellow>{window}\n<gray>Opfer: <white>{victim}\n\n<green>Klicken, um dich zu <yellow>{player}<green> zu teleportieren'

