# ══════════════════════════════════════════════════════════════════════════════
# GUI — Şüpheli sıralaması  (/aet suspect)
#
# Üç renk formatını da destekler (MiniMessage, Hex, eski & kodları).
# Yer tutucular her anahtarın üstündeki yorumlarda belirtilir.
# ══════════════════════════════════════════════════════════════════════════════
gui:
  suspect:

    # GUI penceresinin üstünde gösterilen envanter başlığı.
    title: '<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset><yellow>En Şüpheliler'

    # Envanter slot sayısı (9'un katı olmalı, en fazla 54).
    size: 54

    # ── Oyuncu kafası öğesi ───────────────────────────────────────────────────
    # Her oyuncu kafasının görünen adı. Yer tutucu: {player}
    head_name: '<gold>{player}'

    # Üzerine gelince gösterilen lore. Yer tutucular: {total} {window} {stage}
    lore_total:   '<gray>Toplam İhlal  : <red>{total}'
    lore_window:  '<gray>Pencere İhlali: <yellow>{window}'
    lore_status:  '<gray>Durum          : {stage}'
    lore_click:   '<dark_gray>Ayrıntılı profil için tıkla'

    # ── Aşama etiketleri ──────────────────────────────────────────────────────
    # Yukarıdaki lore_status içine {stage} olarak eklenir.
    stage_watching:  '<aqua>👁 İZLENİYOR'
    stage_testing:   '<yellow>⚠ TEST EDİLİYOR'
    stage_blocking:  '<red>⛔ ENGELLENİYOR'

    # ── Profil sohbet çıktısı ─────────────────────────────────────────────────
    # GUI'de bir oyuncu kafasına tıklanınca sohbette gösterilir.

    # Bölümler arasındaki ayırıcı satır.
    divider: '<dark_gray>──────────────────────────────────────────────'

