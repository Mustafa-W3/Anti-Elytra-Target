# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  AntiElytraTarget v5.3.1.3 — Yapılandırma                           ║
# ║                                                                       ║
# ║  RENK FORMATLARI (üçü aynı metinde birlikte kullanılabilir):          ║
# ║    MiniMessage : <red>, <gradient:red:gold>, <bold>, <italic>         ║
# ║  <hover:show_text:'ipucu'>, <click:run_command:...>                   ║
# ║  Hex renkler : &#FF5555  veya  <#FF5555>  veya  <color:#FF5555>       ║
# ║  Eski kodlar: &a, &c, &e, &7, &f, &l, &o …                            ║
# ╚═══════════════════════════════════════════════════════════════════════╝

# ── Genel (Türkçe dil yapılandırması) ─────────────────────────────────────
general:
  enabled: true
  prefix: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset>"
  # Açıldığında flags.log, her flag için genişletilmiş çalışma zamanı ayrıntılarını içerir.
  debugmod: true

performance:
  # 1 dakikalık TPS bu değerin altına düşerse tespit/tekrar gibi ağır işler otomatik duraklatılır.
  # Koruyucuyu kapatmak için 0 yapın.
  disable_below_tps: 16.0

# ── Tespit (genel anahtar) ────────────────────────────────────────────────
detection:
  enabled: true
  # FIREWORK_ROCKET öğesini ikinci ele koyma girişimlerini iptal eder.
  block_offhand_firework: true
  # Ana elde FIREWORK_ROCKET varken başka oyunculara vurmayı engeller.
  block_mainhand_firework_attacks: false

compatibility:
  # Sunucuya Floodgate/Geyser Bedrock oyuncuları bağlanıyorsa açın.
  bedrock_support: false
  # Oyuncu adı bu değerle başlıyorsa Bedrock kabul edilir.
  bedrock_name_prefix: "."
  # Sentetik ping/transaction paketleri paket sırası kontrollerini çalıştırır.
  # Anti-cheat uyumluluğu için düşük hızda ve pozitif ID'lerle gönderilir.
  synthetic_transactions: true
  synthetic_transaction_interval_ticks: 5

# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  KONTROLLER — Her kontrolde şunlar vardır:                            ║
# ║  enabled     : aç/kapat                                               ║
# ║  decay       : flag üretmeyen her tickte VL azaltımı                  ║
# ║  + kontrole özel eşikler                                              ║
# ╚═══════════════════════════════════════════════════════════════════════╝

checks:
  # ── SAVAŞ KONTROLLERİ ─────────────────────────────────────────────────────
  AngleDeviation:
    enabled: true
    decay: 0.1
    sample_size: 25
    zfactor_vl_limit: 7.0

  AimSnap:
    enabled: true
    decay: 0.15
    spike_vl_limit: 7.0
    randomizer_vl_limit: 2.5

  AttackRate:
    enabled: true
    decay: 0.2
    max_hits_per_second: 12

  TimingConsistency:
    enabled: true
    decay: 0.1
    max_std_dev_ms: 50.0
    sample_size: 6

  ElytraCombatRate:
    enabled: true
    decay: 0.15
    max_rot_per_tick: 40.0
    speed_threshold: 0.5

  # ── NİŞAN KONTROLLERİ ─────────────────────────────────────────────────────
  SmoothAim:
    enabled: true
    decay: 0.1
    max_std_dev: 1.5
    sample_size: 30

  GCD:
    enabled: true
    decay: 0.05

  LookVectorLock:
    enabled: true
    decay: 0.1
    sample_size: 12
    max_variance: 2.0

  PitchLock:
    enabled: true
    decay: 0.1
    sample_size: 15
    max_variance: 4.0

  RotationConsistency:
    enabled: true
    decay: 0.1
    sample_size: 10
    max_std_dev: 1.0


  AimComplex:
    enabled: true
    decay: 0.05
    entropy_vl_limit: 30
    distinct_vl_limit: 4.0
    randomizer_vl_limit: 2.5

  AimHeuristic:
    enabled: true
    decay: 0.03
    basic_vl_limit: 400
    basic_l2_vl_limit: 400
    pattern_buffer_limit: 2.5
    factor_buffer_limit: 3.0

  # ── ELYTRA KONTROLLERİ ────────────────────────────────────────────────────
  VelocityAlign:
    enabled: true
    decay: 0.1
    match_threshold: 8.0
    consecutive_matches: 12
    max_velocity_magnitude: 1.8

  StrafeSync:
    enabled: false
    decay: 0.05
    max_deviation: 0.15
    sample_size: 20
    approach_rate_skip: 0.3

  AccelerationLock:
    enabled: true
    decay: 0.05
    max_std_dev: 0.02
    sample_size: 30
    max_target_age_ms: 2500

  ElytraPhysics:
    enabled: true
    decay: 0.05

  # ── DİĞER KONTROLLER ──────────────────────────────────────────────────────
  FireworkPattern:
    enabled: true
    decay: 0.05
    sample_size: 8
    max_interval_std_dev: 100.0

  OffhandFireworkSwitch:
    enabled: true
    decay: 0.1

  # DENEYSEL
  IncapableSwap:
    enabled: true
    decay: 0.08
    max_tick_span: 1
    max_sequence_ms: 175
    evidence_window_ms: 8000
    evidence_threshold: 3.0

  HeadPitchDivergence:
    enabled: true
    decay: 0.1
    min_y_delta_blocks: 2.0
    max_pitch_delta_deg: 1.5

  UseItemRotationMismatch:
    enabled: true
    decay: 0.05
    allow_previous_rotation: true
    require_gliding: true
    require_firework: true
    min_interval_ms: 0

  PacketOrderE:
    enabled: true
    decay: 0.05

  RotationPrediction:
    enabled: true
    decay: 0.1
    min_target_distance: 0.75
    max_target_distance: 10.0
    target_lock_min_center_distance: 0.35
    orbit_max_target_distance: 8.5
    min_previous_error: 18.0
    max_landing_error: 0.20
    max_hit_error: 0.50
    min_geodesic_rotation: 12.0
    max_geodesic_rotation: 160.0
    min_convergence_ratio: 0.985
    max_correction_residual: 0.35
    rapid_hit_min_yaw: 75.0
    min_sample_gap_ms: 25
    max_sample_gap_ms: 100
    max_candidate_age_ms: 125
    rapid_hit_window_ms: 250
    orbit_detection_enabled: true
    validation_samples: 5
    evidence_hit_window: 16
    required_confirmed_candidates: 3
    rapid_hit_required: 3
    evidence_window_ms: 6000
    alert_cooldown_ms: 5000


# ── Ceza ──────────────────────────────────────────────────────────────────
penalty:
  test_mode_threshold: 2
  block_mode_threshold: 5
  test_mode_block_ratio: 0.5
  kick_enabled: true
  kick_threshold: 20
  kick_message: '<red>Atıldınız: ElytraTarget hilesi tespit edildi.'
  kick_command_enabled: false
  kick_command: "kick {player} ElytraTarget detected"
  ban_enabled: false
  ban_threshold: 60
  ban_message: '<red>Yasaklandınız: ElytraTarget hilesi.'
  ban_duration_minutes: 1440
  ban_command_enabled: false
  ban_command: "tempban {player} 1d ElytraTarget detected"

# ── Kayıt ─────────────────────────────────────────────────────────────────
logging:
  file_logging: true
  log_file_path: "logs/flags.log"
  console_logging: true
  op_alerts_default: true
  log_location: true
  log_victim_info: true
  max_profile_entries: 200

# ── Muafiyetler ───────────────────────────────────────────────────────────
exemptions:
  max_ping: 100
  exempt_creative: true
  exempt_spectator: true
  bypass_permission: "antielytratarget.bypass"

# ── Tekrar Sistemi ────────────────────────────────────────────────────────
# Oyuncular flag eşiğine ulaştığında hareketlerini kaydeder.
# Tekrarlar /aet replay ile GUI menüsünden izlenebilir.
# Harici NPC eklentisi gerekmez — ham NMS paketleri kullanılır.
replay:
  # Tekrar sistemini aç/kapat. Varsayılan: false.
  enabled: false

  # Kayıt her zaman ikinci loglanan flagde başlar; ön kayıt tamponu tutulmaz.

  # Her tekrar kaydının kaç saniye süreceği.
  duration_seconds: 45

  # Flaglenen oyuncunun çevresindeki canlı varlıklar her tekrar karesine kaydedilir.
  entity_radius: 18.0
  max_actors_per_frame: 24
  max_effects_per_frame: 128

  # Yakın zamanda vurulan hedefleri kısa süreliğine yarıçap dışına çıksalar bile kayıtta tutar.
  target_keep_seconds: 8

  # Diskte tutulacak en fazla tekrar dosyası sayısı.
  # En eski tekrarlar otomatik silinmez; elle veya GUI üzerinden yönetin.
  max_files: 100
  isolation_radius: 96.0

# ── Bildirimler ───────────────────────────────────────────────────────────
# Sohbette gösterilen uyarı mesajı. Ayrıntılar için üzerine gelin.
# Yer tutucular: {player} {check} {flags} {window} {location}
notifications:
  alert_message: '<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset><yellow>{player} <dark_gray>| <red>{check} <dark_gray>| <gray>{flags}x <dark_gray>| <gray>{location}'

  # Tüm uyarı satırına uygulanacak tıklama eylemi.
  # alert_click_action: run_command, suggest_command, open_url, copy_to_clipboard
  # Yer tutucular: alert_message ve alert_hover ile aynı.
  alert_click_enabled: true
  alert_click_action: run_command
  alert_click_command: "/aet tpa {player}"

  # Uyarı satırının üzerine gelindiğinde gösterilen ipucu.
  # Yeni satırlar için \n kullanın. MiniMessage, hex ve eski renk kodlarını destekler.
  # Yer tutucular: {player} {ping} {gamemode} {world} {x} {y} {z}
  #               {check} {flags} {window} {victim}
  alert_hover: '<gray>Kullanıcı adı: <white>{player}\n<gray>Ping: <green>{ping}ms\n<gray>Oyun modu: <aqua>{gamemode}\n<gray>Konum: <white>{world} <yellow>{x}<gray>, <yellow>{y}<gray>, <yellow>{z}\n<gray>Kontrol: <red>{check}\n<gray>Toplam İhlal: <red>{flags}\n<gray>Pencere İhlali: <yellow>{window}\n<gray>Mağdur: <white>{victim}\n\n<green>{player} adlı oyuncuya ışınlanmak için tıkla'

# ══════════════════════════════════════════════════════════════════════════════
