#   MiniMessage : <red>, <green>, <yellow>, <gray>, <white>, <gold>, <aqua>
#                 <bold>, <italic>, <gradient:red:gold>, <rainbow>, etc.
#   Hex colors  : &#FF5555  or  <#FF5555>  or  <color:#FF5555>
#   Legacy codes: &a=green  &c=red  &e=yellow  &7=gray  &f=white  etc.
#
# Поддерживаемые плейсхолдеры указаны в комментариях над каждой группой.
# ══════════════════════════════════════════════════════════════════════════════
