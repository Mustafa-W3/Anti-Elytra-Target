  replay_hotbar_help:  '<gray>Панель: <yellow>1 −3 с <gray>| <yellow>4 −0.1x <gray>| <red>5 стоп <gray>| <green>6 +0.1x <gray>| <green>9 +3 с'
  replay_stopped_npc:  '<red>Повтор остановлен, потому что не удалось создать NPC.'
  replay_finished:     '<green>Повтор завершён.'
  replay_flag:         '<red>Флаг повтора <dark_gray>| <yellow>{check} <gray>(всего флагов: <red>{flags}<gray>)'
  replay_stop_item:    '<red>Остановить повтор'
  replay_progress:     '<dark_gray>[<yellow>Повтор<dark_gray>] <gray>{current} с / {duration} с <dark_gray>(<white>{percent}%<dark_gray>) <gray>Скорость: <white>{speed}'

# ══════════════════════════════════════════════════════════════════════════════
# GUI — рейтинг подозреваемых  (/aet suspect)
#
# Поддерживаются все три формата цветов (MiniMessage, Hex, legacy-коды &).
# Плейсхолдеры указаны в комментариях над каждым ключом.
# ══════════════════════════════════════════════════════════════════════════════
gui:
  suspect:

    # Заголовок инвентаря в верхней части окна GUI.
    title: '<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset><yellow>Топ подозреваемых'

    # Количество слотов инвентаря (кратно 9, максимум 54).
    size: 54

    # ── Предмет головы игрока ─────────────────────────────────────────────────
    # Отображаемое имя каждой головы игрока. Плейсхолдер: {player}
    head_name: '<gold>{player}'

    # Описание при наведении. Плейсхолдеры: {total} {window} {stage}
    lore_total:   '<gray>Всего флагов: <red>{total}'
    lore_window:  '<gray>Флагов в окне: <yellow>{window}'
    lore_status:  '<gray>Статус: {stage}'
    lore_click:   '<dark_gray>Нажмите для просмотра подробного профиля'

    # ── Метки состояния ───────────────────────────────────────────────────────
    # Вставляется как {stage} в lore_status выше.
    stage_watching:  '<aqua>👁 НАБЛЮДЕНИЕ'
    stage_testing:   '<yellow>⚠ ПРОВЕРКА'
    stage_blocking:  '<red>⛔ БЛОКИРОВКА'

    # ── Вывод профиля в чат ───────────────────────────────────────────────────
    # Отображается в чате, когда игрок нажимает на голову в GUI.

    # Разделительная строка между секциями.
    divider: '<dark_gray>──────────────────────────────────────────────'

    # Строка заголовка. Плейсхолдер: {player}
    profile_header:  '<gold>  Профиль AntiElytraTarget: <yellow>{player}'

    # Строка UUID. Плейсхолдер: {uuid}
    profile_uuid:    '<gray>  UUID: <white>{uuid}'

    # Строка общего числа flags. Плейсхолдер: {total}
    profile_total:   '<gray>  Всего флагов: <red>{total}'

    # Заголовок разбивки по проверкам.
    profile_breakdown_header: '<aqua>  Распределение флагов:'

    # Строка разбивки по проверкам. Плейсхолдеры: {check} {count}
    profile_breakdown_line: '<dark_gray>    • <yellow>{check}<gray>: <red>{count}'

    # Заголовок последних записей (показывает последние 10 flags).
    profile_recent_header: '<aqua>  Последние 10 записей (сначала новые):'

    # Каждая строка последней записи. Плейсхолдеры: {index} {entry}
    profile_recent_line: '<dark_gray>  [{index}] {entry}'

    # Подсказка внизу. Плейсхолдер: {player}
    profile_footer: '<gray>  Для полной истории используйте <yellow>/aet profile {player} [страница]<gray>.'

    # Отображается, если для выбранного игрока нет постоянного профиля.
    # Плейсхолдер: {player}
    no_profile: '<yellow>Сохранённая история флагов игрока <white>{player}<yellow> отсутствует. Текущие данные доступны в /aet status.'
