# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  AntiElytraTarget v5.3.1.3 — Configuration                          ║
# ║                                                                       ║
# ║  FORMATS DE COULEUR (les trois peuvent être mélangés dans la même chaîne) : ║
# ║    MiniMessage : <red>, <gradient:red:gold>, <bold>, <italic>         ║
# ║  <hover:show_text:'infobulle'>, <click:run_command:...>               ║
# ║  Couleurs hex : &#FF5555  ou  <#FF5555>  ou  <color:#FF5555>          ║
# ║  Codes legacy : &a, &c, &e, &7, &f, &l, &o …                          ║
# ╚═══════════════════════════════════════════════════════════════════════╝

# ── Général (configuration en français) ───────────────────────────────────
general:
  enabled: true
  prefix: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset>"
  # Lorsqu'il est activé, flags.log contient des diagnostics détaillés pour chaque alerte.
  debugmod: true

performance:
  # Si le TPS sur 1 minute passe sous cette valeur, les tâches lourdes de détection/relecture sont mises en pause automatiquement.
  # Mettez 0 pour désactiver cette protection.
  disable_below_tps: 16.0

# ── Détection (interrupteur global) ───────────────────────────────────────
detection:
  enabled: true
  # Annule les tentatives de placer FIREWORK_ROCKET dans la main secondaire.
  block_offhand_firework: true
  # Empêche d'attaquer des joueurs avec FIREWORK_ROCKET dans la main principale.
  block_mainhand_firework_attacks: false

compatibility:
  # Activez uniquement si des joueurs Bedrock Floodgate/Geyser utilisent le serveur.
  bedrock_support: false
  # Les noms commençant par cette valeur sont considérés comme Bedrock.
  bedrock_name_prefix: "."
  # Les paquets synthétiques de ping/transaction alimentent les vérifications d'ordre des paquets.
  # Ils sont envoyés à faible fréquence avec des IDs positifs pour la compatibilité anti-cheat.
  synthetic_transactions: true
  synthetic_transaction_interval_ticks: 5

# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  VÉRIFICATIONS — Chaque vérification contient :                       ║
# ║  enabled     : activer/désactiver                                     ║
# ║  decay       : réduction de VL par tick sans flag                     ║
# ║  + seuils propres à la vérification                                   ║
# ╚═══════════════════════════════════════════════════════════════════════╝

checks:
  # ── VÉRIFICATIONS DE COMBAT ───────────────────────────────────────────────
  AngleDeviation:
    enabled: true
    decay: 0.1
    sample_size: 25
    zfactor_vl_limit: 7.0

  AimSnap:
    enabled: true
    decay: 0.15
    spike_vl_limit: 7.0
    randomizer_vl_limit: 2.5

  AttackRate:
    enabled: true
    decay: 0.2
    max_hits_per_second: 12

  TimingConsistency:
    enabled: true
    decay: 0.1
    max_std_dev_ms: 50.0
    sample_size: 6

  ElytraCombatRate:
    enabled: true
    decay: 0.15
    max_rot_per_tick: 40.0
    speed_threshold: 0.5

  # ── VÉRIFICATIONS DE VISÉE ────────────────────────────────────────────────
  SmoothAim:
    enabled: true
    decay: 0.1
    max_std_dev: 1.5
    sample_size: 30

  GCD:
    enabled: true
    decay: 0.05

  LookVectorLock:
    enabled: true
    decay: 0.1
    sample_size: 12
    max_variance: 2.0

  PitchLock:
    enabled: true
    decay: 0.1
    sample_size: 15
    max_variance: 4.0

  RotationConsistency:
    enabled: true
    decay: 0.1
    sample_size: 10
    max_std_dev: 1.0


  AimComplex:
    enabled: true
    decay: 0.05
    entropy_vl_limit: 30
    distinct_vl_limit: 4.0
    randomizer_vl_limit: 2.5

  AimHeuristic:
    enabled: true
    decay: 0.03
    basic_vl_limit: 400
    basic_l2_vl_limit: 400
    pattern_buffer_limit: 2.5
    factor_buffer_limit: 3.0

  # ── VÉRIFICATIONS D'ELYTRA ────────────────────────────────────────────────
  VelocityAlign:
    enabled: true
    decay: 0.1
    match_threshold: 8.0
    consecutive_matches: 12
    max_velocity_magnitude: 1.8

  StrafeSync:
    enabled: false
    decay: 0.05
    max_deviation: 0.15
    sample_size: 20
    approach_rate_skip: 0.3

  AccelerationLock:
    enabled: true
    decay: 0.05
    max_std_dev: 0.02
    sample_size: 30
    max_target_age_ms: 2500

  ElytraPhysics:
    enabled: true
    decay: 0.05

  # ── VÉRIFICATIONS DIVERSES ────────────────────────────────────────────────
  FireworkPattern:
    enabled: true
    decay: 0.05
    sample_size: 8
    max_interval_std_dev: 100.0

  OffhandFireworkSwitch:
    enabled: true
    decay: 0.1

  # EXPÉRIMENTAL
  IncapableSwap:
    enabled: true
    decay: 0.08
    max_tick_span: 1
    max_sequence_ms: 175
    evidence_window_ms: 8000
    evidence_threshold: 3.0

  HeadPitchDivergence:
    enabled: true
    decay: 0.1
    min_y_delta_blocks: 2.0
    max_pitch_delta_deg: 1.5

  UseItemRotationMismatch:
    enabled: true
    decay: 0.05
    allow_previous_rotation: true
    require_gliding: true
    require_firework: true
    min_interval_ms: 0

  PacketOrderE:
    enabled: true
    decay: 0.05

  RotationPrediction:
    enabled: true
    decay: 0.1
    min_target_distance: 0.75
    max_target_distance: 10.0
    target_lock_min_center_distance: 0.35
    orbit_max_target_distance: 8.5
    min_previous_error: 18.0
    max_landing_error: 0.20
    max_hit_error: 0.50
    min_geodesic_rotation: 12.0
    max_geodesic_rotation: 160.0
    min_convergence_ratio: 0.985
    max_correction_residual: 0.35
    rapid_hit_min_yaw: 75.0
    min_sample_gap_ms: 25
    max_sample_gap_ms: 100
    max_candidate_age_ms: 125
    rapid_hit_window_ms: 250
    orbit_detection_enabled: true
    validation_samples: 5
    evidence_hit_window: 16
    required_confirmed_candidates: 3
    rapid_hit_required: 3
    evidence_window_ms: 6000
    alert_cooldown_ms: 5000


# ── Sanctions ─────────────────────────────────────────────────────────────
penalty:
  test_mode_threshold: 2
  block_mode_threshold: 5
  test_mode_block_ratio: 0.5
  kick_enabled: true
  kick_threshold: 20
  kick_message: '<red>Expulsé : triche ElytraTarget détectée.'
  kick_command_enabled: false
  kick_command: "kick {player} ElytraTarget detected"
  ban_enabled: false
  ban_threshold: 60
  ban_message: '<red>Banni : utilisation de la triche ElytraTarget.'
  ban_duration_minutes: 1440
  ban_command_enabled: false
  ban_command: "tempban {player} 1d ElytraTarget detected"

# ── Journalisation ────────────────────────────────────────────────────────
logging:
  file_logging: true
  log_file_path: "logs/flags.log"
  console_logging: true
  op_alerts_default: true
  log_location: true
  log_victim_info: true
  max_profile_entries: 200

# ── Exemptions ────────────────────────────────────────────────────────────
exemptions:
  max_ping: 100
  exempt_creative: true
  exempt_spectator: true
  bypass_permission: "antielytratarget.bypass"

# ── Système de relecture ──────────────────────────────────────────────────
# Enregistre les actions du joueur lorsqu'il atteint le seuil de flags.
# Les relectures sont visibles via /aet replay dans le menu GUI.
# Aucun plugin NPC externe requis — utilise des paquets NMS bruts.
replay:
  # Activer/désactiver le système de relecture. Par défaut : false.
  enabled: false

  # L'enregistrement commence toujours au deuxième flag journalisé, sans tampon préalable.

  # Durée de chaque enregistrement de relecture, en secondes.
  duration_seconds: 45

  # Les entités vivantes autour du joueur flaggé sont stockées dans chaque frame de relecture.
  entity_radius: 18.0
  max_actors_per_frame: 24
  max_effects_per_frame: 128

  # Conserve les cibles touchées récemment dans l'enregistrement même si elles quittent brièvement le rayon.
  target_keep_seconds: 8

  # Nombre maximal de fichiers de relecture à conserver sur le disque.
  # Les plus anciennes relectures ne sont pas supprimées automatiquement ; gérez-les manuellement ou via la GUI.
  max_files: 100
  isolation_radius: 96.0

# ── Notifications ─────────────────────────────────────────────────────────
# Message d'alerte affiché dans le chat. Survolez-le pour les détails.
# Espaces réservés : {player} {check} {flags} {window} {location}
notifications:
  alert_message: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset><yellow>{player} <dark_gray>| <red>{check} <dark_gray>| <gray>{flags}x <dark_gray>| <gray>{location}"

  # Action de clic appliquée à toute la ligne d'alerte.
  # alert_click_action: run_command, suggest_command, open_url, copy_to_clipboard
  # Espaces réservés : identiques à alert_message et alert_hover.
  alert_click_enabled: true
  alert_click_action: run_command
  alert_click_command: "/aet tpa {player}"

  # Infobulle affichée au survol de la ligne d'alerte.
  # Utilisez \n pour les nouvelles lignes. Prend en charge MiniMessage, hex et les couleurs legacy.
  # Espaces réservés : {player} {ping} {gamemode} {world} {x} {y} {z}
  #               {check} {flags} {window} {victim}
  alert_hover: '<gray>Nom : <white>{player}\n<gray>Ping : <green>{ping}ms\n<gray>Mode de jeu : <aqua>{gamemode}\n<gray>Position : <white>{world} <yellow>{x}<gray>, <yellow>{y}<gray>, <yellow>{z}\n<gray>Contrôle : <red>{check}\n<gray>Alertes totales : <red>{flags}\n<gray>Alertes de fenêtre : <yellow>{window}\n<gray>Victime : <white>{victim}\n\n<green>Cliquez pour vous téléporter vers <yellow>{player}'

