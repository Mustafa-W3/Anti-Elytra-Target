# ══════════════════════════════════════════════════════════════════════════════
# GUI — Classement des suspects  (/aet suspect)
#
# Prend en charge les trois formats de couleur (MiniMessage, Hex, codes legacy &).
# Les espaces réservés sont indiqués dans les commentaires au-dessus de chaque clé.
# ══════════════════════════════════════════════════════════════════════════════
gui:
  suspect:

    # Titre d'inventaire affiché en haut de la fenêtre GUI.
    title: '<yellow>Principaux suspects'

    # Nombre de slots d'inventaire (multiple de 9, max 54).
    size: 54

    # ── Objet tête de joueur ──────────────────────────────────────────────────
    # Nom affiché de chaque tête de joueur. Espace réservé : {player}
    head_name: '<gold>{player}'

    # Lore affichée au survol. Espaces réservés : {total} {window} {stage}
    lore_total:   '<gray>Alertes totales : <red>{total}'
    lore_window:  '<gray>Alertes de fenêtre : <yellow>{window}'
    lore_status:  '<gray>État : {stage}'
    lore_click:   '<dark_gray>Cliquez pour le profil détaillé'

    # ── Libellés d'état ───────────────────────────────────────────────────────
    # Inséré comme {stage} dans lore_status ci-dessus.
    stage_watching:  '<aqua>👁 SOUS SURVEILLANCE'
    stage_testing:   '<yellow>⚠ EN VÉRIFICATION'
    stage_blocking:  '<red>⛔ BLOCAGE ACTIF'

    # ── Sortie du profil dans le chat ─────────────────────────────────────────
    # Affiché dans le chat lorsqu'un joueur clique sur une tête dans la GUI.

    # Ligne de séparation entre les sections.
    divider: '<dark_gray>──────────────────────────────────────────────'

    # Ligne d'en-tête. Espace réservé : {player}
    profile_header:  '<gold>  Profil AntiElytraTarget : <yellow>{player}'

    # Ligne UUID. Espace réservé : {uuid}
    profile_uuid:    '<gray>  UUID : <white>{uuid}'

    # Ligne du total de flags. Espace réservé : {total}
    profile_total:   '<gray>  Alertes totales : <red>{total}'

    # En-tête du détail par vérification.
    profile_breakdown_header: '<aqua>  Répartition des alertes :'

    # Ligne du détail par vérification. Espaces réservés : {check} {count}
    profile_breakdown_line: '<dark_gray>    • <yellow>{check}<gray> : <red>{count}'

    # En-tête des entrées récentes (affiche les 10 derniers flags).
    profile_recent_header: '<aqua>  10 dernières entrées (plus récentes en premier) :'

    # Chaque ligne d'entrée récente. Espaces réservés : {index} {entry}
    profile_recent_line: '<dark_gray>  [{index}] {entry}'

    # Indication de pied de page. Espace réservé : {player}
    profile_footer: '<gray>  Utilisez <yellow>/aet profile {player} [page]<gray> pour l’historique complet.'

    # Affiché lorsqu'aucun profil persistant n'existe pour le joueur sélectionné.
    # Espace réservé : {player}
    no_profile: '<yellow>Aucun historique persistant pour <white>{player}<yellow>. Utilisez /aet status pour les données en direct.'
