# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  AntiElytraTarget v5.3.1.3 — Configuración                          ║
# ║                                                                       ║
# ║  FORMATOS DE COLOR (los tres pueden mezclarse en la misma cadena):    ║
# ║    MiniMessage : <red>, <gradient:red:gold>, <bold>, <italic>         ║
# ║  <hover:show_text:'ayuda'>, <click:run_command:...>                   ║
# ║  Colores hex : &#FF5555  o  <#FF5555>  o  <color:#FF5555>             ║
# ║  Códigos legacy: &a, &c, &e, &7, &f, &l, &o …                         ║
# ╚═══════════════════════════════════════════════════════════════════════╝

# ── General (configuración en español) ────────────────────────────────────
general:
  enabled: true
  prefix: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset>"
  # Al activarlo, flags.log incluye detalles de ejecución ampliados para cada alerta.
  debugmod: true

performance:
  # Si el TPS de 1 minuto cae por debajo de este valor, las tareas pesadas de detección/repetición se pausan automáticamente.
  # Ponlo en 0 para desactivar esta protección.
  disable_below_tps: 16.0

# ── Detección (interruptor global) ────────────────────────────────────────
detection:
  enabled: true
  # Cancela los intentos de poner FIREWORK_ROCKET en la mano secundaria.
  block_offhand_firework: true
  # Impide atacar a jugadores mientras se sostiene FIREWORK_ROCKET en la mano principal.
  block_mainhand_firework_attacks: false

compatibility:
  # Actívalo solo si jugadores Bedrock de Floodgate/Geyser usan el servidor.
  bedrock_support: false
  # Los nombres que empiecen por este valor se consideran Bedrock.
  bedrock_name_prefix: "."
  # Los paquetes sintéticos de ping/transacción alimentan las comprobaciones de orden de paquetes.
  # Se envían a baja frecuencia con IDs positivos para compatibilidad con anti-cheats.
  synthetic_transactions: true
  synthetic_transaction_interval_ticks: 5

# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  COMPROBACIONES — Cada comprobación tiene:                            ║
# ║  enabled     : activar/desactivar                                     ║
# ║  decay       : reducción de VL por tick sin flag                      ║
# ║  + umbrales específicos de la comprobación                            ║
# ╚═══════════════════════════════════════════════════════════════════════╝

checks:
  # ── COMPROBACIONES DE COMBATE ─────────────────────────────────────────────
  AngleDeviation:
    enabled: true
    decay: 0.1
    sample_size: 25
    zfactor_vl_limit: 7.0

  AimSnap:
    enabled: true
    decay: 0.15
    spike_vl_limit: 7.0
    randomizer_vl_limit: 2.5

  AttackRate:
    enabled: true
    decay: 0.2
    max_hits_per_second: 12

  TimingConsistency:
    enabled: true
    decay: 0.1
    max_std_dev_ms: 50.0
    sample_size: 6

  ElytraCombatRate:
    enabled: true
    decay: 0.15
    max_rot_per_tick: 40.0
    speed_threshold: 0.5

  # ── COMPROBACIONES DE APUNTADO ────────────────────────────────────────────
  SmoothAim:
    enabled: true
    decay: 0.1
    max_std_dev: 1.5
    sample_size: 30

  GCD:
    enabled: true
    decay: 0.05

  LookVectorLock:
    enabled: true
    decay: 0.1
    sample_size: 12
    max_variance: 2.0

  PitchLock:
    enabled: true
    decay: 0.1
    sample_size: 15
    max_variance: 4.0

  RotationConsistency:
    enabled: true
    decay: 0.1
    sample_size: 10
    max_std_dev: 1.0


  AimComplex:
    enabled: true
    decay: 0.05
    entropy_vl_limit: 30
    distinct_vl_limit: 4.0
    randomizer_vl_limit: 2.5

  AimHeuristic:
    enabled: true
    decay: 0.03
    basic_vl_limit: 400
    basic_l2_vl_limit: 400
    pattern_buffer_limit: 2.5
    factor_buffer_limit: 3.0

  # ── COMPROBACIONES DE ELYTRA ──────────────────────────────────────────────
  VelocityAlign:
    enabled: true
    decay: 0.1
    match_threshold: 8.0
    consecutive_matches: 12
    max_velocity_magnitude: 1.8

  StrafeSync:
    enabled: false
    decay: 0.05
    max_deviation: 0.15
    sample_size: 20
    approach_rate_skip: 0.3

  AccelerationLock:
    enabled: true
    decay: 0.05
    max_std_dev: 0.02
    sample_size: 30
    max_target_age_ms: 2500

  ElytraPhysics:
    enabled: true
    decay: 0.05

  # ── COMPROBACIONES VARIAS ─────────────────────────────────────────────────
  FireworkPattern:
    enabled: true
    decay: 0.05
    sample_size: 8
    max_interval_std_dev: 100.0

  OffhandFireworkSwitch:
    enabled: true
    decay: 0.1

  # EXPERIMENTAL
  IncapableSwap:
    enabled: true
    decay: 0.08
    max_tick_span: 1
    max_sequence_ms: 175
    evidence_window_ms: 8000
    evidence_threshold: 3.0

  HeadPitchDivergence:
    enabled: true
    decay: 0.1
    min_y_delta_blocks: 2.0
    max_pitch_delta_deg: 1.5

  UseItemRotationMismatch:
    enabled: true
    decay: 0.05
    allow_previous_rotation: true
    require_gliding: true
    require_firework: true
    min_interval_ms: 0

  PacketOrderE:
    enabled: true
    decay: 0.05

  RotationPrediction:
    enabled: true
    decay: 0.1
    min_target_distance: 0.75
    max_target_distance: 10.0
    target_lock_min_center_distance: 0.35
    orbit_max_target_distance: 8.5
    min_previous_error: 18.0
    max_landing_error: 0.20
    max_hit_error: 0.50
    min_geodesic_rotation: 12.0
    max_geodesic_rotation: 160.0
    min_convergence_ratio: 0.985
    max_correction_residual: 0.35
    rapid_hit_min_yaw: 75.0
    min_sample_gap_ms: 25
    max_sample_gap_ms: 100
    max_candidate_age_ms: 125
    rapid_hit_window_ms: 250
    orbit_detection_enabled: true
    validation_samples: 5
    evidence_hit_window: 16
    required_confirmed_candidates: 3
    rapid_hit_required: 3
    evidence_window_ms: 6000
    alert_cooldown_ms: 5000


# ── Penalización ──────────────────────────────────────────────────────────
penalty:
  test_mode_threshold: 2
  block_mode_threshold: 5
  test_mode_block_ratio: 0.5
  kick_enabled: true
  kick_threshold: 20
  kick_message: '<red>Expulsado: se detectó el hack ElytraTarget.'
  kick_command_enabled: false
  kick_command: "kick {player} ElytraTarget detected"
  ban_enabled: false
  ban_threshold: 60
  ban_message: '<red>Bloqueado: uso del hack ElytraTarget.'
  ban_duration_minutes: 1440
  ban_command_enabled: false
  ban_command: "tempban {player} 1d ElytraTarget detected"

# ── Registro ──────────────────────────────────────────────────────────────
logging:
  file_logging: true
  log_file_path: "logs/flags.log"
  console_logging: true
  op_alerts_default: true
  log_location: true
  log_victim_info: true
  max_profile_entries: 200

# ── Exenciones ────────────────────────────────────────────────────────────
exemptions:
  max_ping: 100
  exempt_creative: true
  exempt_spectator: true
  bypass_permission: "antielytratarget.bypass"

# ── Sistema de repeticiones ───────────────────────────────────────────────
# Registra las acciones del jugador cuando alcanza el umbral de flags.
# Las repeticiones se pueden ver con /aet replay desde el menú GUI.
# No requiere plugins NPC externos — usa paquetes NMS directos.
replay:
  # Activa/desactiva el sistema de repeticiones. Predeterminado: false.
  enabled: false

  # La grabación siempre empieza en el segundo flag registrado, sin búfer previo.

  # Duración en segundos de cada grabación de repetición.
  duration_seconds: 45

  # Las entidades vivas alrededor del jugador marcado se guardan en cada fotograma de repetición.
  entity_radius: 18.0
  max_actors_per_frame: 24
  max_effects_per_frame: 128

  # Mantiene en la grabación los objetivos golpeados recientemente aunque salgan brevemente del radio.
  target_keep_seconds: 8

  # Número máximo de archivos de repetición que se conservarán en disco.
  # Las repeticiones más antiguas no se borran automáticamente; gestiónalas manualmente o desde la GUI.
  max_files: 100
  isolation_radius: 96.0

# ── Notificaciones ────────────────────────────────────────────────────────
# Mensaje de alerta mostrado en el chat. Pasa el cursor para ver detalles.
# Marcadores: {player} {check} {flags} {window} {location}
notifications:
  alert_message: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset><yellow>{player} <dark_gray>| <red>{check} <dark_gray>| <gray>{flags}x <dark_gray>| <gray>{location}"

  # Acción de clic aplicada a toda la línea de alerta.
  # alert_click_action: run_command, suggest_command, open_url, copy_to_clipboard
  # Marcadores: los mismos que alert_message y alert_hover.
  alert_click_enabled: true
  alert_click_action: run_command
  alert_click_command: "/aet tpa {player}"

  # Tooltip mostrado al pasar el cursor sobre la línea de alerta.
  # Usa \n para nuevas líneas. Soporta MiniMessage, hex y colores legacy.
  # Marcadores: {player} {ping} {gamemode} {world} {x} {y} {z}
  #               {check} {flags} {window} {victim}
  alert_hover: '<gray>Usuario: <white>{player}\n<gray>Ping: <green>{ping}ms\n<gray>Modo de juego: <aqua>{gamemode}\n<gray>Posición: <white>{world} <yellow>{x}<gray>, <yellow>{y}<gray>, <yellow>{z}\n<gray>Comprobación: <red>{check}\n<gray>Alertas totales: <red>{flags}\n<gray>Alertas de ventana: <yellow>{window}\n<gray>Víctima: <white>{victim}\n\n<green>Haz clic para teletransportarte a <yellow>{player}'

