# ══════════════════════════════════════════════════════════════════════════════
# GUI — Clasificación de sospechosos  (/aet suspect)
#
# Soporta los tres formatos de color (MiniMessage, Hex, códigos legacy &).
# Los marcadores se indican en los comentarios sobre cada clave.
# ══════════════════════════════════════════════════════════════════════════════
gui:
  suspect:

    # Título de inventario mostrado arriba de la ventana GUI.
    title: '<yellow>Principales sospechosos'

    # Número de slots del inventario (debe ser múltiplo de 9, máx. 54).
    size: 54

    # ── Ítem de cabeza de jugador ─────────────────────────────────────────────
    # Nombre visible de cada calavera de jugador. Marcador: {player}
    head_name: '<gold>{player}'

    # Lore mostrado al pasar el cursor. Marcadores: {total} {window} {stage}
    lore_total:   '<gray>Alertas totales: <red>{total}'
    lore_window:  '<gray>Alertas de ventana: <yellow>{window}'
    lore_status:  '<gray>Estado: {stage}'
    lore_click:   '<dark_gray>Haz clic para ver el perfil detallado'

    # ── Etiquetas de estado ───────────────────────────────────────────────────
    # Se inserta como {stage} en lore_status arriba.
    stage_watching:  '<aqua>👁 EN OBSERVACIÓN'
    stage_testing:   '<yellow>⚠ EN PRUEBA'
    stage_blocking:  '<red>⛔ BLOQUEANDO'

    # ── Salida de perfil en el chat ───────────────────────────────────────────
    # Se muestra en el chat cuando un jugador hace clic en una cabeza en la GUI.

    # Línea separadora entre secciones.
    divider: '<dark_gray>──────────────────────────────────────────────'

    # Línea de encabezado. Marcador: {player}
    profile_header:  '<gold>  Perfil de AntiElytraTarget: <yellow>{player}'

    # Línea de UUID. Marcador: {uuid}
    profile_uuid:    '<gray>  UUID: <white>{uuid}'

    # Línea de flags totales. Marcador: {total}
    profile_total:   '<gray>  Alertas totales: <red>{total}'

    # Encabezado del desglose por comprobación.
    profile_breakdown_header: '<aqua>  Desglose de alertas:'

    # Fila del desglose por comprobación. Marcadores: {check} {count}
    profile_breakdown_line: '<dark_gray>    • <yellow>{check}<gray>: <red>{count}'

    # Encabezado de entradas recientes (muestra los últimos 10 flags).
    profile_recent_header: '<aqua>  Últimas 10 entradas (más nuevas primero):'

    # Cada fila de entrada reciente. Marcadores: {index} {entry}
    profile_recent_line: '<dark_gray>  [{index}] {entry}'

    # Pista del pie. Marcador: {player}
    profile_footer: '<gray>  Usa <yellow>/aet profile {player} [página]<gray> para ver el historial completo.'

    # Se muestra cuando no existe un perfil persistente para el jugador seleccionado.
    # Marcador: {player}
    no_profile: '<yellow>No hay historial persistente de <white>{player}<yellow>. Usa /aet status para ver los datos en vivo.'
