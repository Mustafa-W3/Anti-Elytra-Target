# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  AntiElytraTarget v5.3.1.3 — Configuração                           ║
# ║                                                                       ║
# ║  FORMATOS DE COR (os três podem ser misturados na mesma cadeia):      ║
# ║    MiniMessage : <red>, <gradient:red:gold>, <bold>, <italic>         ║
# ║  <hover:show_text:'dica'>, <click:run_command:...>                    ║
# ║  Cores hex   : &#FF5555  ou  <#FF5555>  ou  <color:#FF5555>           ║
# ║  Códigos legacy: &a, &c, &e, &7, &f, &l, &o …                         ║
# ╚═══════════════════════════════════════════════════════════════════════╝

# ── Geral (configuração em português) ─────────────────────────────────────
general:
  enabled: true
  prefix: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset>"
  # Quando ativado, flags.log inclui detalhes de execução ampliados para cada flag.
  debugmod: true

performance:
  # Se o TPS de 1 minuto cair abaixo deste valor, tarefas pesadas de deteção/repetição pausam automaticamente.
  # Defina como 0 para desativar esta proteção.
  disable_below_tps: 16.0

# ── Deteção (interruptor global) ──────────────────────────────────────────
detection:
  enabled: true
  # Cancela tentativas de colocar FIREWORK_ROCKET na mão secundária.
  block_offhand_firework: true
  # Impede ataques a jogadores com FIREWORK_ROCKET na mão principal.
  block_mainhand_firework_attacks: false

compatibility:
  # Ative apenas se jogadores Bedrock Floodgate/Geyser usarem o servidor.
  bedrock_support: false
  # Nomes iniciados por este valor são tratados como Bedrock.
  bedrock_name_prefix: "."
  # Pacotes sintéticos de ping/transação alimentam as verificações de ordem de pacotes.
  # São enviados a baixa frequência com IDs positivos para compatibilidade com anti-cheats.
  synthetic_transactions: true
  synthetic_transaction_interval_ticks: 5

# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  VERIFICAÇÕES — Cada verificação tem:                                 ║
# ║  enabled     : ativar/desativar                                       ║
# ║  decay       : redução de VL por tick sem flag                        ║
# ║  + limites específicos da verificação                                 ║
# ╚═══════════════════════════════════════════════════════════════════════╝

checks:
  # ── VERIFICAÇÕES DE COMBATE ───────────────────────────────────────────────
  AngleDeviation:
    enabled: true
    decay: 0.1
    sample_size: 25
    zfactor_vl_limit: 7.0

  AimSnap:
    enabled: true
    decay: 0.15
    spike_vl_limit: 7.0
    randomizer_vl_limit: 2.5

  AttackRate:
    enabled: true
    decay: 0.2
    max_hits_per_second: 12

  TimingConsistency:
    enabled: true
    decay: 0.1
    max_std_dev_ms: 50.0
    sample_size: 6

  ElytraCombatRate:
    enabled: true
    decay: 0.15
    max_rot_per_tick: 40.0
    speed_threshold: 0.5

  # ── VERIFICAÇÕES DE MIRA ──────────────────────────────────────────────────
  SmoothAim:
    enabled: true
    decay: 0.1
    max_std_dev: 1.5
    sample_size: 30

  GCD:
    enabled: true
    decay: 0.05

  LookVectorLock:
    enabled: true
    decay: 0.1
    sample_size: 12
    max_variance: 2.0

  PitchLock:
    enabled: true
    decay: 0.1
    sample_size: 15
    max_variance: 4.0

  RotationConsistency:
    enabled: true
    decay: 0.1
    sample_size: 10
    max_std_dev: 1.0


  AimComplex:
    enabled: true
    decay: 0.05
    entropy_vl_limit: 30
    distinct_vl_limit: 4.0
    randomizer_vl_limit: 2.5

  AimHeuristic:
    enabled: true
    decay: 0.03
    basic_vl_limit: 400
    basic_l2_vl_limit: 400
    pattern_buffer_limit: 2.5
    factor_buffer_limit: 3.0

  # ── VERIFICAÇÕES DE ELYTRA ────────────────────────────────────────────────
  VelocityAlign:
    enabled: true
    decay: 0.1
    match_threshold: 8.0
    consecutive_matches: 12
    max_velocity_magnitude: 1.8

  StrafeSync:
    enabled: false
    decay: 0.05
    max_deviation: 0.15
    sample_size: 20
    approach_rate_skip: 0.3

  AccelerationLock:
    enabled: true
    decay: 0.05
    max_std_dev: 0.02
    sample_size: 30
    max_target_age_ms: 2500

  ElytraPhysics:
    enabled: true
    decay: 0.05

  # ── VERIFICAÇÕES DIVERSAS ─────────────────────────────────────────────────
  FireworkPattern:
    enabled: true
    decay: 0.05
    sample_size: 8
    max_interval_std_dev: 100.0

  OffhandFireworkSwitch:
    enabled: true
    decay: 0.1

  # EXPERIMENTAL
  IncapableSwap:
    enabled: true
    decay: 0.08
    max_tick_span: 1
    max_sequence_ms: 175
    evidence_window_ms: 8000
    evidence_threshold: 3.0

  HeadPitchDivergence:
    enabled: true
    decay: 0.1
    min_y_delta_blocks: 2.0
    max_pitch_delta_deg: 1.5

  UseItemRotationMismatch:
    enabled: true
    decay: 0.05
    allow_previous_rotation: true
    require_gliding: true
    require_firework: true
    min_interval_ms: 0

  PacketOrderE:
    enabled: true
    decay: 0.05

  RotationPrediction:
    enabled: true
    decay: 0.1
    min_target_distance: 0.75
    max_target_distance: 10.0
    target_lock_min_center_distance: 0.35
    orbit_max_target_distance: 8.5
    min_previous_error: 18.0
    max_landing_error: 0.20
    max_hit_error: 0.50
    min_geodesic_rotation: 12.0
    max_geodesic_rotation: 160.0
    min_convergence_ratio: 0.985
    max_correction_residual: 0.35
    rapid_hit_min_yaw: 75.0
    min_sample_gap_ms: 25
    max_sample_gap_ms: 100
    max_candidate_age_ms: 125
    rapid_hit_window_ms: 250
    orbit_detection_enabled: true
    validation_samples: 5
    evidence_hit_window: 16
    required_confirmed_candidates: 3
    rapid_hit_required: 3
    evidence_window_ms: 6000
    alert_cooldown_ms: 5000


# ── Penalização ───────────────────────────────────────────────────────────
penalty:
  test_mode_threshold: 2
  block_mode_threshold: 5
  test_mode_block_ratio: 0.5
  kick_enabled: true
  kick_threshold: 20
  kick_message: '<red>Expulso: hack ElytraTarget detetado.'
  kick_command_enabled: false
  kick_command: "kick {player} ElytraTarget detected"
  ban_enabled: false
  ban_threshold: 60
  ban_message: '<red>Banido: utilização do hack ElytraTarget.'
  ban_duration_minutes: 1440
  ban_command_enabled: false
  ban_command: "tempban {player} 1d ElytraTarget detected"

# ── Registo ───────────────────────────────────────────────────────────────
logging:
  file_logging: true
  log_file_path: "logs/flags.log"
  console_logging: true
  op_alerts_default: true
  log_location: true
  log_victim_info: true
  max_profile_entries: 200

# ── Exceções ──────────────────────────────────────────────────────────────
exemptions:
  max_ping: 100
  exempt_creative: true
  exempt_spectator: true
  bypass_permission: "antielytratarget.bypass"

# ── Sistema de repetições ─────────────────────────────────────────────────
# Regista as ações do jogador quando atinge o limite de flags.
# As repetições podem ser vistas com /aet replay no menu GUI.
# Não requer plugins NPC externos — usa pacotes NMS diretos.
replay:
  # Ativa/desativa o sistema de repetições. Predefinição: false.
  enabled: false

  # A gravação começa sempre na segunda flag registada, sem buffer anterior.

  # Duração em segundos de cada gravação de repetição.
  duration_seconds: 45

  # Entidades vivas em redor do jogador sinalizado são guardadas em cada frame da repetição.
  entity_radius: 18.0
  max_actors_per_frame: 24
  max_effects_per_frame: 128

  # Mantém na gravação alvos atingidos recentemente, mesmo que saiam brevemente do raio.
  target_keep_seconds: 8

  # Número máximo de ficheiros de repetição a manter no disco.
  # As repetições mais antigas não são apagadas automaticamente; faça a gestão manualmente ou pela GUI.
  max_files: 100
  isolation_radius: 96.0

# ── Notificações ──────────────────────────────────────────────────────────
# Mensagem de alerta mostrada no chat. Passe o cursor para ver detalhes.
# Marcadores: {player} {check} {flags} {window} {location}
notifications:
  alert_message: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset><yellow>{player} <dark_gray>| <red>{check} <dark_gray>| <gray>{flags}x <dark_gray>| <gray>{location}"

  # Ação de clique aplicada a toda a linha de alerta.
  # alert_click_action: run_command, suggest_command, open_url, copy_to_clipboard
  # Marcadores: iguais a alert_message e alert_hover.
  alert_click_enabled: true
  alert_click_action: run_command
  alert_click_command: "/aet tpa {player}"

  # Dica mostrada ao passar o cursor sobre a linha de alerta.
  # Use \n para novas linhas. Suporta MiniMessage, hex e cores legacy.
  # Marcadores: {player} {ping} {gamemode} {world} {x} {y} {z}
  #               {check} {flags} {window} {victim}
  alert_hover: '<gray>Nome de utilizador: <white>{player}\n<gray>Ping: <green>{ping}ms\n<gray>Modo de jogo: <aqua>{gamemode}\n<gray>Posição: <white>{world} <yellow>{x}<gray>, <yellow>{y}<gray>, <yellow>{z}\n<gray>Verificação: <red>{check}\n<gray>Alertas totais: <red>{flags}\n<gray>Alertas da janela: <yellow>{window}\n<gray>Vítima: <white>{victim}\n\n<green>Clica para te teletransportares até <yellow>{player}'

