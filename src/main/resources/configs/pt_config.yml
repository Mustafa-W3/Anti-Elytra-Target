# ══════════════════════════════════════════════════════════════════════════════
# GUI — Classificação de suspeitos  (/aet suspect)
#
# Suporta os três formatos de cor (MiniMessage, Hex, códigos legacy &).
# Os marcadores estão indicados nos comentários acima de cada chave.
# ══════════════════════════════════════════════════════════════════════════════
gui:
  suspect:

    # Título do inventário mostrado no topo da janela GUI.
    title: '<yellow>Principais suspeitos'

    # Número de slots do inventário (deve ser múltiplo de 9, máx. 54).
    size: 54

    # ── Item de cabeça de jogador ─────────────────────────────────────────────
    # Nome apresentado de cada cabeça de jogador. Marcador: {player}
    head_name: '<gold>{player}'

    # Lore mostrada ao passar o cursor. Marcadores: {total} {window} {stage}
    lore_total:   '<gray>Alertas totais: <red>{total}'
    lore_window:  '<gray>Alertas da janela: <yellow>{window}'
    lore_status:  '<gray>Estado: {stage}'
    lore_click:   '<dark_gray>Clica para ver o perfil detalhado'

    # ── Etiquetas de estado ───────────────────────────────────────────────────
    # Inserido como {stage} em lore_status acima.
    stage_watching:  '<aqua>👁 EM OBSERVAÇÃO'
    stage_testing:   '<yellow>⚠ EM VERIFICAÇÃO'
    stage_blocking:  '<red>⛔ A BLOQUEAR'

    # ── Saída do perfil no chat ───────────────────────────────────────────────
    # Mostrado no chat quando um jogador clica numa cabeça na GUI.

    # Linha separadora entre secções.
    divider: '<dark_gray>──────────────────────────────────────────────'

    # Linha de cabeçalho. Marcador: {player}
    profile_header:  '<gold>  Perfil AntiElytraTarget: <yellow>{player}'

    # Linha UUID. Marcador: {uuid}
    profile_uuid:    '<gray>  UUID: <white>{uuid}'

    # Linha de flags totais. Marcador: {total}
    profile_total:   '<gray>  Alertas totais: <red>{total}'

    # Cabeçalho do detalhe por verificação.
    profile_breakdown_header: '<aqua>  Distribuição dos alertas:'

    # Linha do detalhe por verificação. Marcadores: {check} {count}
    profile_breakdown_line: '<dark_gray>    • <yellow>{check}<gray>: <red>{count}'

    # Cabeçalho de entradas recentes (mostra as últimas 10 flags).
    profile_recent_header: '<aqua>  Últimos 10 registos (mais recentes primeiro):'

    # Cada linha de entrada recente. Marcadores: {index} {entry}
    profile_recent_line: '<dark_gray>  [{index}] {entry}'

    # Dica de rodapé. Marcador: {player}
    profile_footer: '<gray>  Usa <yellow>/aet profile {player} [página]<gray> para o histórico completo.'

    # Mostrado quando não existe perfil persistente para o jogador selecionado.
    # Marcador: {player}
    no_profile: '<yellow>Não existe histórico persistente para <white>{player}<yellow>. Usa /aet status para os dados em direto.'
