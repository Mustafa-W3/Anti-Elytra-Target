# ══════════════════════════════════════════════════════════════════════════════
# GUI — Classifica sospetti  (/aet suspect)
#
# Supporta tutti e tre i formati colore (MiniMessage, Hex, codici legacy &).
# I segnaposto sono indicati nei commenti sopra ogni chiave.
# ══════════════════════════════════════════════════════════════════════════════
gui:
  suspect:

    # Titolo inventario mostrato in alto nella finestra GUI.
    title: '<yellow>Sospetti principali'

    # Numero di slot inventario (deve essere multiplo di 9, max 54).
    size: 54

    # ── Oggetto testa giocatore ───────────────────────────────────────────────
    # Nome visualizzato di ogni testa giocatore. Segnaposto: {player}
    head_name: '<gold>{player}'

    # Lore mostrata al passaggio del mouse. Segnaposto: {total} {window} {stage}
    lore_total:   '<gray>Segnalazioni totali: <red>{total}'
    lore_window:  '<gray>Segnalazioni finestra: <yellow>{window}'
    lore_status:  '<gray>Stato: {stage}'
    lore_click:   '<dark_gray>Clicca per il profilo dettagliato'

    # ── Etichette stato ───────────────────────────────────────────────────────
    # Inserito come {stage} in lore_status sopra.
    stage_watching:  '<aqua>👁 SOTTO OSSERVAZIONE'
    stage_testing:   '<yellow>⚠ IN VERIFICA'
    stage_blocking:  '<red>⛔ BLOCCO ATTIVO'

    # ── Output profilo in chat ────────────────────────────────────────────────
    # Mostrato in chat quando un giocatore clicca una testa nella GUI.

    # Linea separatrice tra sezioni.
    divider: '<dark_gray>──────────────────────────────────────────────'

    # Riga intestazione. Segnaposto: {player}
    profile_header:  '<gold>  Profilo AntiElytraTarget: <yellow>{player}'

    # Riga UUID. Segnaposto: {uuid}
    profile_uuid:    '<gray>  UUID: <white>{uuid}'

    # Riga flag totali. Segnaposto: {total}
    profile_total:   '<gray>  Segnalazioni totali: <red>{total}'

    # Intestazione del riepilogo per controllo.
    profile_breakdown_header: '<aqua>  Ripartizione delle segnalazioni:'

    # Riga del riepilogo per controllo. Segnaposto: {check} {count}
    profile_breakdown_line: '<dark_gray>    • <yellow>{check}<gray>: <red>{count}'

    # Intestazione voci recenti (mostra gli ultimi 10 flag).
    profile_recent_header: '<aqua>  Ultime 10 voci (dalla più recente):'

    # Ogni riga di voce recente. Segnaposto: {index} {entry}
    profile_recent_line: '<dark_gray>  [{index}] {entry}'

    # Suggerimento nel piè di pagina. Segnaposto: {player}
    profile_footer: '<gray>  Usa <yellow>/aet profile {player} [pagina]<gray> per la cronologia completa.'

    # Mostrato quando non esiste un profilo persistente per il giocatore cliccato.
    # Segnaposto: {player}
    no_profile: '<yellow>Nessuna cronologia persistente per <white>{player}<yellow>. Usa /aet status per i dati in tempo reale.'
