# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  AntiElytraTarget v5.3.1.3 — Configurazione                         ║
# ║                                                                       ║
# ║  FORMATI COLORE (tutti e tre possono essere usati nella stessa stringa): ║
# ║    MiniMessage : <red>, <gradient:red:gold>, <bold>, <italic>         ║
# ║  <hover:show_text:'suggerimento'>, <click:run_command:...>            ║
# ║  Colori hex  : &#FF5555  oppure  <#FF5555>  oppure  <color:#FF5555>   ║
# ║  Codici legacy: &a, &c, &e, &7, &f, &l, &o …                          ║
# ╚═══════════════════════════════════════════════════════════════════════╝

# ── Generale (configurazione in italiano) ─────────────────────────────────
general:
  enabled: true
  prefix: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset>"
  # Se attivo, flags.log include dettagli di esecuzione estesi per ogni segnalazione.
  debugmod: true

performance:
  # Se il TPS a 1 minuto scende sotto questo valore, i lavori pesanti di rilevamento/replay vengono messi in pausa automaticamente.
  # Imposta 0 per disattivare questa protezione.
  disable_below_tps: 16.0

# ── Rilevamento (interruttore globale) ────────────────────────────────────
detection:
  enabled: true
  # Annulla i tentativi di mettere FIREWORK_ROCKET nella mano secondaria.
  block_offhand_firework: true
  # Impedisce di attaccare giocatori con FIREWORK_ROCKET nella mano principale.
  block_mainhand_firework_attacks: false

compatibility:
  # Attiva solo se giocatori Bedrock Floodgate/Geyser usano il server.
  bedrock_support: false
  # I nomi che iniziano con questo valore vengono considerati Bedrock.
  bedrock_name_prefix: "."
  # I pacchetti sintetici di ping/transazione alimentano i controlli sull'ordine dei pacchetti.
  # Vengono inviati a bassa frequenza con ID positivi per compatibilità anti-cheat.
  synthetic_transactions: true
  synthetic_transaction_interval_ticks: 5

# ╔═══════════════════════════════════════════════════════════════════════╗
# ║  CONTROLLI — Ogni controllo ha:                                       ║
# ║  enabled     : attiva/disattiva                                       ║
# ║  decay       : riduzione VL per tick senza flag                       ║
# ║  + soglie specifiche del controllo                                    ║
# ╚═══════════════════════════════════════════════════════════════════════╝

checks:
  # ── CONTROLLI DI COMBATTIMENTO ────────────────────────────────────────────
  AngleDeviation:
    enabled: true
    decay: 0.1
    sample_size: 25
    zfactor_vl_limit: 7.0

  AimSnap:
    enabled: true
    decay: 0.15
    spike_vl_limit: 7.0
    randomizer_vl_limit: 2.5

  AttackRate:
    enabled: true
    decay: 0.2
    max_hits_per_second: 12

  TimingConsistency:
    enabled: true
    decay: 0.1
    max_std_dev_ms: 50.0
    sample_size: 6

  ElytraCombatRate:
    enabled: true
    decay: 0.15
    max_rot_per_tick: 40.0
    speed_threshold: 0.5

  # ── CONTROLLI DI MIRA ─────────────────────────────────────────────────────
  SmoothAim:
    enabled: true
    decay: 0.1
    max_std_dev: 1.5
    sample_size: 30

  GCD:
    enabled: true
    decay: 0.05

  LookVectorLock:
    enabled: true
    decay: 0.1
    sample_size: 12
    max_variance: 2.0

  PitchLock:
    enabled: true
    decay: 0.1
    sample_size: 15
    max_variance: 4.0

  RotationConsistency:
    enabled: true
    decay: 0.1
    sample_size: 10
    max_std_dev: 1.0


  AimComplex:
    enabled: true
    decay: 0.05
    entropy_vl_limit: 30
    distinct_vl_limit: 4.0
    randomizer_vl_limit: 2.5

  AimHeuristic:
    enabled: true
    decay: 0.03
    basic_vl_limit: 400
    basic_l2_vl_limit: 400
    pattern_buffer_limit: 2.5
    factor_buffer_limit: 3.0

  # ── CONTROLLI ELYTRA ──────────────────────────────────────────────────────
  VelocityAlign:
    enabled: true
    decay: 0.1
    match_threshold: 8.0
    consecutive_matches: 12
    max_velocity_magnitude: 1.8

  StrafeSync:
    enabled: false
    decay: 0.05
    max_deviation: 0.15
    sample_size: 20
    approach_rate_skip: 0.3

  AccelerationLock:
    enabled: true
    decay: 0.05
    max_std_dev: 0.02
    sample_size: 30
    max_target_age_ms: 2500

  ElytraPhysics:
    enabled: true
    decay: 0.05

  # ── CONTROLLI VARI ────────────────────────────────────────────────────────
  FireworkPattern:
    enabled: true
    decay: 0.05
    sample_size: 8
    max_interval_std_dev: 100.0

  OffhandFireworkSwitch:
    enabled: true
    decay: 0.1

  # SPERIMENTALE
  IncapableSwap:
    enabled: true
    decay: 0.08
    max_tick_span: 1
    max_sequence_ms: 175
    evidence_window_ms: 8000
    evidence_threshold: 3.0

  HeadPitchDivergence:
    enabled: true
    decay: 0.1
    min_y_delta_blocks: 2.0
    max_pitch_delta_deg: 1.5

  UseItemRotationMismatch:
    enabled: true
    decay: 0.05
    allow_previous_rotation: true
    require_gliding: true
    require_firework: true
    min_interval_ms: 0

  PacketOrderE:
    enabled: true
    decay: 0.05

  RotationPrediction:
    enabled: true
    decay: 0.1
    min_target_distance: 0.75
    max_target_distance: 10.0
    target_lock_min_center_distance: 0.35
    orbit_max_target_distance: 8.5
    min_previous_error: 18.0
    max_landing_error: 0.20
    max_hit_error: 0.50
    min_geodesic_rotation: 12.0
    max_geodesic_rotation: 160.0
    min_convergence_ratio: 0.985
    max_correction_residual: 0.35
    rapid_hit_min_yaw: 75.0
    min_sample_gap_ms: 25
    max_sample_gap_ms: 100
    max_candidate_age_ms: 125
    rapid_hit_window_ms: 250
    orbit_detection_enabled: true
    validation_samples: 5
    evidence_hit_window: 16
    required_confirmed_candidates: 3
    rapid_hit_required: 3
    evidence_window_ms: 6000
    alert_cooldown_ms: 5000


# ── Penalità ──────────────────────────────────────────────────────────────
penalty:
  test_mode_threshold: 2
  block_mode_threshold: 5
  test_mode_block_ratio: 0.5
  kick_enabled: true
  kick_threshold: 20
  kick_message: '<red>Espulso: rilevato hack ElytraTarget.'
  kick_command_enabled: false
  kick_command: "kick {player} ElytraTarget detected"
  ban_enabled: false
  ban_threshold: 60
  ban_message: '<red>Bannato: utilizzo di hack ElytraTarget.'
  ban_duration_minutes: 1440
  ban_command_enabled: false
  ban_command: "tempban {player} 1d ElytraTarget detected"

# ── Registrazione ─────────────────────────────────────────────────────────
logging:
  file_logging: true
  log_file_path: "logs/flags.log"
  console_logging: true
  op_alerts_default: true
  log_location: true
  log_victim_info: true
  max_profile_entries: 200

# ── Esenzioni ─────────────────────────────────────────────────────────────
exemptions:
  max_ping: 100
  exempt_creative: true
  exempt_spectator: true
  bypass_permission: "antielytratarget.bypass"

# ── Sistema replay ────────────────────────────────────────────────────────
# Registra le azioni del giocatore quando raggiunge la soglia di flag.
# I replay possono essere visti con /aet replay dal menu GUI.
# Nessun plugin NPC esterno richiesto — usa pacchetti NMS grezzi.
replay:
  # Attiva/disattiva il sistema replay. Predefinito: false.
  enabled: false

  # La registrazione inizia sempre al secondo flag registrato, senza buffer precedente.

  # Durata in secondi di ogni registrazione replay.
  duration_seconds: 45

  # Le entità viventi intorno al giocatore flaggato vengono salvate in ogni frame del replay.
  entity_radius: 18.0
  max_actors_per_frame: 24
  max_effects_per_frame: 128

  # Mantiene nella registrazione i bersagli colpiti di recente anche se escono brevemente dal raggio.
  target_keep_seconds: 8

  # Numero massimo di file replay da conservare su disco.
  # I replay più vecchi non vengono eliminati automaticamente; gestiscili manualmente o dalla GUI.
  max_files: 100
  isolation_radius: 96.0

# ── Notifiche ─────────────────────────────────────────────────────────────
# Messaggio di avviso mostrato in chat. Passa sopra col mouse per i dettagli.
# Segnaposto: {player} {check} {flags} {window} {location}
notifications:
  alert_message: "<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset><yellow>{player} <dark_gray>| <red>{check} <dark_gray>| <gray>{flags}x <dark_gray>| <gray>{location}"

  # Azione di clic applicata all'intera riga di avviso.
  # alert_click_action: run_command, suggest_command, open_url, copy_to_clipboard
  # Segnaposto: uguali a alert_message e alert_hover.
  alert_click_enabled: true
  alert_click_action: run_command
  alert_click_command: "/aet tpa {player}"

  # Tooltip mostrato passando il mouse sulla riga di avviso.
  # Usa \n per nuove righe. Supporta MiniMessage, hex e colori legacy.
  # Segnaposto: {player} {ping} {gamemode} {world} {x} {y} {z}
  #               {check} {flags} {window} {victim}
  alert_hover: '<gray>Nome utente: <white>{player}\n<gray>Ping: <green>{ping}ms\n<gray>Modalità di gioco: <aqua>{gamemode}\n<gray>Posizione: <white>{world} <yellow>{x}<gray>, <yellow>{y}<gray>, <yellow>{z}\n<gray>Controllo: <red>{check}\n<gray>Segnalazioni totali: <red>{flags}\n<gray>Segnalazioni finestra: <yellow>{window}\n<gray>Vittima: <white>{victim}\n\n<green>Clicca per teletrasportarti da <yellow>{player}'

