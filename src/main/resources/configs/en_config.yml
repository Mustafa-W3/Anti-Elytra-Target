# ══════════════════════════════════════════════════════════════════════════════
# GUI — Suspect Leaderboard  (/aet suspect)
#
# Supports all three color formats (MiniMessage, Hex, Legacy &-codes).
# Placeholders are noted in the comments above each key.
# ══════════════════════════════════════════════════════════════════════════════
gui:
  suspect:

    # Inventory title shown at the top of the GUI window.
    title: '<gray>&l[&x&F&F&0&0&0&0&lA&x&F&9&0&B&0&B&lE&x&F&3&1&5&1&5&lT<gray>&l] <reset><yellow>Top Suspects'

    # Number of inventory slots (must be a multiple of 9, max 54).
    size: 54

    # ── Player Head Item ─────────────────────────────────────────────────
    # Display name of each player skull. Placeholder: {player}
    head_name: '<gold>{player}'

    # Lore shown on hover. Placeholders: {total} {window} {stage}
    lore_total:   '<gray>Total Flags  : <red>{total}'
    lore_window:  '<gray>Window Flags : <yellow>{window}'
    lore_status:  '<gray>Status       : {stage}'
    lore_click:   '<dark_gray>Click for detailed profile'

    # ── Stage Labels ─────────────────────────────────────────────────────
    # Inserted as {stage} in lore_status above.
    stage_watching:  '<aqua>👁 WATCHING'
    stage_testing:   '<yellow>⚠ TESTING'
    stage_blocking:  '<red>⛔ BLOCKING'

    # ── Profile Chat Output ──────────────────────────────────────────────
    # Shown in chat when a player clicks a head in the GUI.

    # Separator line between sections.
    divider: '<dark_gray>──────────────────────────────────────────────'

    # Header line. Placeholder: {player}
    profile_header:  '<gold>  AntiElytraTarget <white>Profile: <yellow>{player}'

    # UUID line. Placeholder: {uuid}
    profile_uuid:    '<gray>  UUID: <white>{uuid}'

    # Total flags line. Placeholder: {total}
    profile_total:   '<gray>  Total Flags: <red>{total}'

    # Per-check breakdown header.
    profile_breakdown_header: '<aqua>  Flag Breakdown:'

    # Per-check breakdown row. Placeholders: {check} {count}
    profile_breakdown_line: '<dark_gray>    • <yellow>{check}<gray>: <red>{count}'

    # Recent entries header (shows last 10 flags).
    profile_recent_header: '<aqua>  Last 10 entries (newest first):'

    # Each recent entry row. Placeholders: {index} {entry}
    profile_recent_line: '<dark_gray>  [{index}] {entry}'

    # Footer hint. Placeholder: {player}
    profile_footer: '<gray>  Use <yellow>/aet profile {player} [page]<gray> for full paginated history.'

    # Shown when no persistent profile exists for the clicked player.
    # Placeholder: {player}
    no_profile: '<yellow>No persistent flag history for <white>{player}<yellow>. Check /aet status for live data.'
