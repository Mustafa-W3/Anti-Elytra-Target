buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.6.1'
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.3.1'
    }
}

plugins {
    id 'java'
}

apply plugin: 'com.gradleup.shadow'

group = 'com.antielytratarget'
version = '5.3.1.3'
description = 'AntiElytraTarget - Advanced elytra targeting hack detection for Minecraft 1.16.5+ (Paper, Spigot, Folia, Canvas)'

def adventureVersion = '4.26.1'
def examinationVersion = '1.3.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven {
        name = 'grim-snapshots'
        url = 'https://repo.grim.ac/snapshots'
    }
    maven {
        name = 'grim-public-snapshots'
        url = 'https://maven.grim.ac/public/snapshots'
    }
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'spigotmc'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
}

dependencies {

compileOnly('io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT')
    testImplementation('io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT')

compileOnly('io.netty:netty-all:4.1.107.Final')
    testRuntimeOnly('io.netty:netty-all:4.1.107.Final') {
        exclude group: 'io.netty', module: 'netty-transport-native-epoll'
        exclude group: 'io.netty', module: 'netty-transport-native-kqueue'
        exclude group: 'io.netty', module: 'netty-resolver-dns-native-macos'
    }

    implementation("net.kyori:adventure-api:${adventureVersion}")
    implementation("net.kyori:adventure-key:${adventureVersion}")
    implementation("net.kyori:adventure-nbt:${adventureVersion}")
    implementation("net.kyori:adventure-text-minimessage:${adventureVersion}")
    implementation("net.kyori:adventure-text-serializer-legacy:${adventureVersion}")
    implementation("net.kyori:adventure-text-serializer-plain:${adventureVersion}")
    implementation("net.kyori:examination-api:${examinationVersion}")
    implementation("net.kyori:examination-string:${examinationVersion}")
    implementation('org.jspecify:jspecify:1.0.0')

    implementation('com.github.retrooper:packetevents-spigot:2.13.1+4d40422-SNAPSHOT')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('rotationPredictionSimulation', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Runs deterministic and Monte Carlo RotationPrediction regressions.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.check.elytra.RotationPredictionSimulation'
}

tasks.register('aimStatisticsRegression', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Runs deterministic statistical-aim false-positive regressions.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.utils.AimStatisticsRegressionSimulation'
}

tasks.register('messageUtilRegression', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies cached and compiled message rendering compatibility.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.utils.MessageUtilRegressionSimulation'
}

tasks.register('playerFlagDataConcurrency', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies atomic flag-window updates and cleanup races.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.models.PlayerFlagDataConcurrencySimulation'
}

tasks.register('bedrockDetectionRegression', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies Floodgate UUID detection without requiring Geyser at test runtime.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.utils.BedrockPlayerUtilRegressionSimulation'
}

tasks.register('flagLogEntryRegression', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies flags.log formatting, UUID privacy, debug details, and history parsing.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.models.FlagLogEntryRegressionSimulation'
}

tasks.register('useItemRotationMismatchRegression', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies Grim-compatible use-item rotation packet handling.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.netty.UseItemRotationMismatchRegressionSimulation'
}

tasks.register('rotationMismatchEvidenceRegression', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies isolated and same-tick use-item rotation mismatches do not flag.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.check.misc.RotationMismatchEvidenceRegressionSimulation'
}

tasks.register('grimTickReliabilityRegression', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies Grim-compatible packet-order tick reliability and FP guards.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.netty.GrimTickReliabilityRegressionSimulation'
}

tasks.register('incapableSwapRegression', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies IncapableSwap hotbar and tracked-item behavior.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.netty.SilentFireworkStateRegressionSimulation'
}

tasks.register('replayPhysicsRegression', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies replay firework physics, legacy compatibility, and compressed storage.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.replay.ReplayPhysicsRegressionSimulation'
}

tasks.register('folia2612Compatibility', JavaExec) {
    dependsOn tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies the Folia opt-in and Minecraft 26.1.2 packet mappings.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.antielytratarget.Folia2612CompatibilitySimulation'
}

tasks.named('check') {
    dependsOn tasks.named('rotationPredictionSimulation')
    dependsOn tasks.named('aimStatisticsRegression')
    dependsOn tasks.named('messageUtilRegression')
    dependsOn tasks.named('playerFlagDataConcurrency')
    dependsOn tasks.named('bedrockDetectionRegression')
    dependsOn tasks.named('flagLogEntryRegression')
    dependsOn tasks.named('useItemRotationMismatchRegression')
    dependsOn tasks.named('rotationMismatchEvidenceRegression')
    dependsOn tasks.named('grimTickReliabilityRegression')
    dependsOn tasks.named('incapableSwapRegression')
    dependsOn tasks.named('replayPhysicsRegression')
    dependsOn tasks.named('folia2612Compatibility')
}

tasks.named('shadowJar') {
    archiveFileName = "AntiElytraTarget-${version}-input.jar"
    destinationDirectory = layout.buildDirectory.dir("tmp/shadow")

configurations = [project.configurations.runtimeClasspath]

    relocate 'com.github.retrooper.packetevents', "${project.group}.shaded.com.github.retrooper.packetevents"
    relocate 'io.github.retrooper.packetevents', "${project.group}.shaded.io.github.retrooper.packetevents"

    mergeServiceFiles()
    exclude 'org/bstats/**'

    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

tasks.register('obfuscateJar', proguard.gradle.ProGuardTask) {
    dependsOn tasks.named('shadowJar')
    group = 'build'
    description = 'Obfuscates the shaded plugin jar with ProGuard.'

    injars tasks.named('shadowJar').flatMap { it.archiveFile }
    outjars layout.buildDirectory.file("libs/AntiElytraTarget-${version}.jar")
    configuration file('proguard-rules.pro')

libraryjars(configurations.compileClasspath - configurations.runtimeClasspath)
    libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod",
            jarfilter: '!**.jar', filter: '!module-info.class'
}

build.dependsOn tasks.named('obfuscateJar')

jar {
    enabled = false
}
